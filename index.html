<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/icon.ico" />

    <!-- Security Meta -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO -->
    <title>OneStone — Elite Digital Agency</title>
    <meta name="description" content="OneStone is an elite digital agency crafting bold brands, immersive websites, AI automation, and memorable digital experiences. We build for businesses that deserve better." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#EAE8E4" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OneStone — Elite Digital Agency" />
    <meta property="og:description" content="We craft bold brands, immersive websites, AI automation, and memorable digital experiences. Built for businesses that deserve better." />
    <meta property="og:url" content="https://onestone.agency" />
    <meta property="og:site_name" content="OneStone" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OneStone — Elite Digital Agency" />
    <meta name="twitter:description" content="We craft bold brands, immersive websites, AI automation, and memorable digital experiences." />

    <!-- Google Font - Preconnect + Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cookie&display=swap"
      rel="stylesheet"
    />

    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://cdn.cosmos.so" />
  </head>

  <body>
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
